[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoserv-processor"
version = "1.0.0"
description = "CVG GeoServ Processor — Centralized geoprocessing engine for CVG wizard workflows"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Alex Zelenski, GISP", email = "azelenski@clearviewgeographic.com" }]
requires-python = ">=3.11"
keywords = ["geoprocessing", "raster", "gis", "flood", "compound hazard", "storm surge", "sea level rise"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: Other/Proprietary License",
]

dependencies = [
  "rasterio>=1.3",
  "numpy>=1.26",
  "click>=8.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "fiona>=1.9",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "flake8>=7.0",
  "black>=24.0",
]

[project.scripts]
geoserv-processor = "geoserv_processor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geoserv_processor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py311"]
